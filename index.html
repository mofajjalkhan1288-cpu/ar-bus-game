# ar-bus-game
Bangladesh 3D Bus Simulator
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR BUS GAME — Bangladesh Bus Simulator</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.panel{background:#07111dcc;border:1px solid #ffffff35;border-radius:12px;padding:9px 12px;font-weight:bold}
#speed{font-size:25px;color:#8df5ff}
#status{font-size:12px;line-height:1.6;text-align:right}
#topButtons{position:fixed;top:76px;right:10px;display:flex;gap:7px;z-index:8}
button{border:1px solid #ffffff55;background:#142b3ddd;color:white;border-radius:10px;padding:10px 12px;font-weight:bold;font-size:13px}
#controls{position:fixed;bottom:16px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;z-index:8;pointer-events:none}
.group{display:flex;gap:10px;align-items:end;pointer-events:auto}
.ctrl{width:68px;height:68px;border-radius:50%;font-size:23px;background:#102b40dd;border:2px solid #9ddfff}
.ctrl.long{width:76px;height:76px;background:#13502ddd}
.ctrl:active,button.active{background:#168b78}
#gearBox{position:fixed;bottom:112px;right:16px;z-index:7;display:flex;gap:5px}
#gearBox button{padding:9px 12px}
#start{position:fixed;inset:0;z-index:20;background:linear-gradient(#06111ddd,#06111df2);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
#start .card{max-width:440px;width:100%;background:#0c1d2a;border:1px solid #ffffff35;border-radius:20px;padding:25px}
#start h1{margin:0 0 8px;font-size:30px;color:#8df5ff}
#start p{color:#c7d8e2;line-height:1.5}
#start button{background:#087c70;font-size:17px;padding:14px 24px}
#help{position:fixed;left:10px;bottom:115px;background:#07111dcc;padding:8px 10px;border-radius:9px;font-size:11px;color:#d4e4ec;z-index:6}
@media(max-width:420px){.ctrl{width:60px;height:60px}.ctrl.long{width:68px;height:68px}#status{font-size:10px}}
</style>
</head>
<body>

<div id="game"></div>

<div id="hud">
 <div class="panel">
  <div id="speed">0 km/h</div>
  <div style="font-size:11px;color:#c4dce7">AR BUS GAME</div>
 </div>
 <div class="panel" id="status">গিয়ার: N<br>দূরত্ব: 0.00 km<br>ভাড়া: ৳0</div>
</div>

<div id="topButtons">
 <button id="cameraBtn">ক্যামেরা</button>
 <button id="hornBtn">হর্ন</button>
 <button id="lightBtn">লাইট</button>
 <button id="pauseBtn">বিরতি</button>
</div>

<div id="help">মোবাইল: বোতাম | কম্পিউটার: ↑ ↓ ← →</div>

<div id="gearBox">
 <button data-gear="R">R</button>
 <button data-gear="N" class="active">N</button>
 <button data-gear="D">D</button>
</div>

<div id="controls">
 <div class="group">
  <button class="ctrl" data-input="left">◀</button>
  <button class="ctrl" data-input="right">▶</button>
 </div>
 <div class="group">
  <button class="ctrl" data-input="brake">■</button>
  <button class="ctrl long" data-input="gas">▲</button>
 </div>
</div>

<div id="start">
 <div class="card">
  <h1>AR BUS GAME</h1>
  <h2>বাংলাদেশ বাস সিমুলেটর</h2>
  <p>একটি প্রাথমিক 3D ড্রাইভিং প্রোটোটাইপ। গাড়ি চালাতে গিয়ার D দিন, তারপর গ্যাস চাপুন।</p>
  <button id="startBtn">গেম শুরু করো</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(()=>{
const root=document.getElementById('game');

if(!window.THREE){
 document.getElementById('start').querySelector('p').textContent='3D লাইব্রেরি লোড হয়নি। ইন্টারনেট চালু করে পেজটি আবার খুলুন।';
 return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87c8e8);
scene.fog=new THREE.Fog(0x87c8e8,75,260);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdff5ff,0x52613b,1.5));

const sun=new THREE.DirectionalLight(0xffffff,1.25);
sun.position.set(-30,60,25);
sun.castShadow=true;
scene.add(sun);

const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.8});

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(600,600),
 mat(0x4e8b49)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.12;
ground.receiveShadow=true;
scene.add(ground);

const road=new THREE.Mesh(
 new THREE.PlaneGeometry(18,500),
 mat(0x343a40)
);
road.rotation.x=-Math.PI/2;
scene.add(road);

const lineMat=mat(0xf4e8b0);

for(let z=-240;z<260;z+=14){
 const l=new THREE.Mesh(new THREE.BoxGeometry(.22,.035,7),lineMat);
 l.position.set(0,.025,z);
 scene.add(l);
}

for(let x of [-9.1,9.1]){
 const edge=new THREE.Mesh(
  new THREE.BoxGeometry(.25,.08,500),
  mat(0xe5dfc8)
 );
 edge.position.set(x,.03,0);
 scene.add(edge);
}

function box(w,h,d,color,x,y,z,parent=scene){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  mat(color)
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function tree(x,z){
 const g=new THREE.Group();
 box(.45,2,.45,0x76502d,0,1,0,g);

 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(1.35,9,7),
  mat(0x28753d)
 );
 crown.position.y=2.5;
 crown.castShadow=true;
 g.add(crown);

 g.position.set(x,0,z);
 scene.add(g);
}

for(let z=-230;z<260;z+=17){
 tree(-14-Math.random()*7,z);
 tree(14+Math.random()*7,z+7);

 if(z%34===0){
  box(4,2.8,3,0xc99a65,-17,1.4,z-5);
  box(4,3.4,3,0x7b9bba,17,1.7,z+4);
 }
}

const bus=new THREE.Group();
scene.add(bus);

box(3.15,1.35,7,0xd72e28,0,1.75,0,bus);
box(3.05,.75,6.85,0xe6e9e8,0,2.78,0,bus);
box(3.18,.35,7.05,0x1b3445,0,3.3,0,bus);

for(let z of [-2.45,-.8,.85,2.45]){
 box(.035,.65,.04,0x263c4c,-1.53,2.8,z,bus);
 box(.035,.65,.04,0x263c4c,1.53,2.8,z,bus);
}

box(2.7,.65,.08,0x172b38,0,2.78,3.48,bus);

for(let x of [-1.65,1.65]){
 for(let z of [-2.25,2.25]){
  const w=new THREE.Mesh(
   new THREE.CylinderGeometry(.52,.52,.28,16),
   mat(0x15191d)
  );
  w.rotation.z=Math.PI/2;
  w.position.set(x,.65,z);
  w.castShadow=true;
  bus.add(w);
 }
}

box(.6,.18,.1,0xffe99a,-.9,1.85,3.56,bus);
box(.6,.18,.1,0xffe99a,.9,1.85,3.56,bus);

bus.position.set(0,0,8);

const traffic=[];

for(let i=0;i<8;i++){
 const car=new THREE.Group();

 box(1.65,.8,3,[0x1683b8,0xe1c23a,0xeeeeee,0x267c45][i%4],0,.75,0,car);
 box(1.5,.55,1.35,0x273e50,0,1.35,-.2,car);

 car.position.set((i%2?5:-5),0,-35-i*27);
 scene.add(car);
 traffic.push(car);
}

let gear='N';
let speed=0;
let distance=0;
let fare=0;
let paused=false;
let camMode=0;
let lights=false;

const input={
 gas:false,
 brake:false,
 left:false,
 right:false
};

function setInput(k,v){
 input[k]=v;
}

document.querySelectorAll('[data-input]').forEach(b=>{
 const k=b.dataset.input;

 b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  setInput(k,true);
  b.classList.add('active');
 });

 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
  b.addEventListener(ev,e=>{
   setInput(k,false);
   b.classList.remove('active');
  });
 });
});

document.querySelectorAll('[data-gear]').forEach(b=>{
 b.onclick=()=>{
  gear=b.dataset.gear;

  document.querySelectorAll('[data-gear]').forEach(x=>{
   x.classList.toggle('active',x===b);
  });
 };
});

addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'||e.key==='w')input.gas=true;
 if(e.key==='ArrowDown'||e.key==='s')input.brake=true;
 if(e.key==='ArrowLeft'||e.key==='a')input.left=true;
 if(e.key==='ArrowRight'||e.key==='d')input.right=true;
});

addEventListener('keyup',e=>{
 if(e.key==='ArrowUp'||e.key==='w')input.gas=false;
 if(e.key==='ArrowDown'||e.key==='s')input.brake=false;
 if(e.key==='ArrowLeft'||e.key==='a')input.left=false;
 if(e.key==='ArrowRight'||e.key==='d')input.right=false;
});

document.getElementById('startBtn').onclick=()=>{
 document.getElementById('start').style.display='none';
};

document.getElementById('cameraBtn').onclick=()=>{
 camMode=(camMode+1)%3;
};

document.getElementById('pauseBtn').onclick=()=>{
 paused=!paused;
 document.getElementById('pauseBtn').textContent=paused?'চালু':'বিরতি';
};

document.getElementById('lightBtn').onclick=()=>{
 lights=!lights;
 document.getElementById('lightBtn').classList.toggle('active',lights);
};

let audioCtx;

document.getElementById('hornBtn').onclick=()=>{
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();

  o.type='sawtooth';
  o.frequency.value=220;
  g.gain.value=.12;

  o.connect(g);
  g.connect(audioCtx.destination);

  o.start();
  o.stop(audioCtx.currentTime+.35);
 }catch(e){}
};

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(!paused&&document.getElementById('start').style.display==='none'){

  if(gear==='D'&&input.gas){
   speed=Math.min(95,speed+24*dt);
  }
  else if(gear==='R'&&input.gas){
   speed=Math.min(22,speed+12*dt);
  }
  else{
   speed=Math.max(0,speed-9*dt);
  }

  if(input.brake){
   speed=Math.max(0,speed-48*dt);
  }

  const dir=gear==='R'?-1:1;

  const steering=(input.left?1:0)-(input.right?1:0);

  bus.position.x=THREE.MathUtils.clamp(
   bus.position.x+steering*(speed/95)*8*dt,
   -6.5,6.5
  );

  bus.rotation.y=THREE.MathUtils.lerp(
   bus.rotation.y,-steering*.13,.08
  );

  const dz=speed/3.6*dt*dir;
  bus.position.z-=dz;
  distance+=Math.abs(dz)/1000;

  traffic.forEach(c=>{
   c.position.z+=speed/3.6*dt*.35;

   if(c.position.z>bus.position.z+35){
    c.position.z=bus.position.z-210-Math.random()*60;
   }
  });

  if(speed<1&&Math.abs(bus.position.z%160)<.15){
   fare+=20;
  }
 }

 if(camMode===0){
  camera.position.lerp(
   new THREE.Vector3(bus.position.x,6.2,bus.position.z+13),.08
  );
  camera.lookAt(bus.position.x,1.8,bus.position.z-5);
 }
 else if(camMode===1){
  camera.position.set(bus.position.x,bus.position.y+3,bus.position.z+1.8);
  camera.lookAt(bus.position.x,2.7,bus.position.z-10);
 }
 else{
  camera.position.lerp(
   new THREE.Vector3(bus.position.x,22,bus.position.z+3),.08
  );
  camera.lookAt(bus.position.x,0,bus.position.z-3);
 }

 document.getElementById('speed').textContent=Math.round(speed)+' km/h';

 document.getElementById('status').innerHTML=
  'গিয়ার: '+gear+
  '<br>দূরত্ব: '+distance.toFixed(2)+' km'+
  '<br>ভাড়া: ৳'+fare;

 renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

})();
</script>
</body>
</html>
